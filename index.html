<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>星座占卜所</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&family=Noto+Sans+TC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="sky" aria-hidden="true"></canvas>

    <main class="stage">
      <!-- 第一頁：暱稱與生日 -->
      <section id="screen-intro" class="screen is-active">
        <p class="eyebrow">✦ Celestial Oracle ✦</p>
        <h1 class="title">星座占卜所</h1>
        <p class="lead">
          回答幾個關於你的小問題，<br />讓星星猜猜你是哪個星座。
        </p>
        <form id="intro-form" class="card form" novalidate>
          <label class="field">
            <span>你的暱稱</span>
            <input
              id="nickname"
              maxlength="12"
              placeholder="例如：小星星"
              required
              type="text"
            />
          </label>
          <label class="field">
            <span>你的生日</span>
            <input id="birthday" max="2026-12-31" min="1900-01-01" required type="date" />
          </label>
          <p id="intro-error" class="error" role="alert"></p>
          <button class="btn primary" type="submit">開始占卜 →</button>
        </form>
        <p class="fineprint">生日只在你的瀏覽器裡使用，不會上傳到任何地方。</p>
      </section>

      <!-- 問答 -->
      <section id="screen-quiz" class="screen">
        <div class="progress" aria-hidden="true"><div id="progress-bar"></div></div>
        <p id="q-count" class="eyebrow"></p>
        <h2 id="q-text" class="question"></h2>
        <div id="q-options" class="options"></div>
        <button id="q-back" class="btn ghost small" type="button">← 上一題</button>
      </section>

      <!-- 占星中 -->
      <section id="screen-loading" class="screen">
        <div class="orb" aria-hidden="true"></div>
        <p id="loading-text" class="lead">星星正在排列中…</p>
      </section>

      <!-- 結果 -->
      <section id="screen-result" class="screen">
        <div class="card guess">
          <p class="eyebrow">根據你的回答，星星猜你是</p>
          <p id="guess-sign" class="guess-sign"></p>
          <p id="guess-why" class="muted"></p>
        </div>

        <div class="reveal">
          <p class="eyebrow">生日揭曉 · 你真正的星座</p>
          <h2 id="result-title" class="result-title"></h2>
          <p id="result-verdict" class="verdict"></p>
        </div>

        <figure class="share-card">
          <canvas id="share-canvas" height="1620" width="1080"></canvas>
          <figcaption class="muted">這張卡片可以下載或直接分享給朋友</figcaption>
        </figure>

        <div class="card traits">
          <p id="result-desc"></p>
          <dl id="result-meta" class="meta"></dl>
        </div>

        <div class="actions">
          <button id="btn-share" class="btn primary" type="button">分享圖片</button>
          <button id="btn-download" class="btn" type="button">下載圖片</button>
          <button id="btn-again" class="btn ghost" type="button">再玩一次</button>
        </div>
        <p id="share-msg" class="fineprint" role="status"></p>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
